[package]
name = "chrome-toolbox-obs-comment-relay"
version = "0.1.0"
description = "Local OBS comment relay"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.27.0", features = ["v4"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.53.2", features = ["net", "sync", "time", "macros", "io-util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"
